# Local stack (L11 §2). `pnpm local:up` / `pnpm local:down`.
name: afr-local
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: afr
      POSTGRES_PASSWORD: afr-local-only
      POSTGRES_DB: afr
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afr -d afr"]
      interval: 2s
      retries: 30
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.3.5
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "2"]
    ports: ["8545:8545"]
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
  localstack:
    image: localstack/localstack:4.7
    environment:
      SERVICES: kms,s3,secretsmanager
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 3s
      retries: 30
